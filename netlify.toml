# Netlify builds the site itself from this repository on every push.
# The Supabase values are set in Netlify → Site configuration → Environment variables,
# not committed here.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# About You routes inside the page (#/today, #/d/handle), so every request serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
